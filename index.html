<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><title>Min Ekonomi</title><style>
:root{font-family:system-ui,sans-serif;color:#17312d;background:#f1f5f4}body{margin:0}header{background:#0f766e;color:white;padding:18px}main{max-width:1050px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button,.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700}.tabs button.active,.btn{background:#0f766e;color:white}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd6d3;border-radius:9px;margin:5px 0 10px}.money{font-size:1.5rem;font-weight:800}.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e5ecea;padding:10px 0}.danger{color:#b42318}.bar{height:10px;background:#dbe7e4;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#0f766e}.muted{color:#64746f;font-size:.9rem}dialog{border:0;border-radius:16px;max-width:520px;width:90%}nav{position:sticky;top:0;background:#f1f5f4;padding-top:8px}@media(prefers-color-scheme:dark){:root{color:#e8f0ee;background:#10201e}.card{background:#18302c}.tabs button{color:#17312d}.tabs button.active{color:white}input,select{background:#10201e;color:white;border-color:#45605b}.row{border-color:#34504a}nav{background:#10201e}}
</style></head><body><header><b>Min Ekonomi</b><div class="muted" style="color:#d8f3ed">Budget, poster och statistik</div></header><main><nav class="tabs" id="tabs"></nav><section id="view"></section></main><dialog id="edit"><form method="dialog" id="form"><h2 id="formTitle">Ny post</h2><input type="hidden" id="id"><label>Datum<input id="date" type="date" required></label><label>Typ<select id="type"><option value="expense">Utgift</option><option value="income">Inkomst</option></select></label><label>Belopp<input id="amount" type="number" min="0.01" step="0.01" required></label><label>Kategori<select id="category"></select></label><label>Person<select id="person"><option>Gemensamt</option><option>Mikael</option><option>Dotter</option></select></label><label>Kommentar<input id="note"></label><div style="display:flex;gap:8px"><button class="btn" value="save">Spara</button><button value="cancel">Avbryt</button></div></form></dialog><script src="app.js"></script></body></html>
