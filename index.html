<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>Min Ekonomi</title><style>:root{font-family:system-ui,sans-serif;color:#17312d;background:#f1f5f4}*{box-sizing:border-box}body{margin:0}header{background:#0f766e;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#f1f5f4;padding:7px 0;z-index:2}.tabs button,.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:700}.tabs .active,.btn{background:#0f766e;color:white}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}input,select{width:100%;padding:10px;border:1px solid #ccd6d3;border-radius:9px;margin:5px 0 10px;font:inherit}.money{font-size:1.45rem;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e5ecea;padding:10px 0}.muted{color:#64746f}.danger{color:#b42318}.ok{color:#087443}.pill{display:inline-block;padding:5px 10px;margin:3px;border-radius:99px;background:#d7ede8;color:#17312d;border:1px solid #77aa9f;font-size:.84rem}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.bar{height:9px;background:#dbe7e4;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#0f766e}dialog{border:0;border-radius:16px;width:min(92%,520px)}@media(prefers-color-scheme:dark){:root{color:#e8f0ee;background:#10201e}.card{background:#18302c}.tabs{background:#10201e}.tabs button{color:#17312d}.tabs .active{color:white}input,select{background:#10201e;color:white;border-color:#45605b}.row{border-color:#34504a}.pill{background:#24443e;color:#f2fbf9;border-color:#79aa9f}}</style></head><body><header><b>Min Ekonomi</b><div>Budget, sparande och statistik · version 0.8.1</div></header><main><nav class="tabs" id="tabs"></nav><section id="view"></section></main><dialog id="tx"><form id="txForm"><h2>Post</h2><input type="hidden" id="txId"><label>Datum<input id="txDate" type="date" required></label><label>Typ<select id="txType"><option value="expense">Utgift</option><option value="income">Inkomst</option></select></label><label>Belopp<input id="txAmount" type="number" min=".01" step=".01" required></label><label>Kategori<select id="txCategory"></select></label><label>Person<select id="txPerson"><option>Gemensamt</option><option>Mikael</option><option>Dotter</option></select></label><label>Kommentar<input id="txNote"></label><button class="btn">Spara</button> <button type="button" id="txCancel">Avbryt</button></form></dialog><script src="./app.js"></script></body></html>
